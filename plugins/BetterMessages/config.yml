# Configuration for BetterMessages
config-version: 16
disable-outdated-config-warning: false
check-for-updates: false
bungeecord-mode: false

internal-messages:
  prefix: "[&c&lSERVER NGƯỜI GẦY&r] "
  help-redirect: "&bType \"/bm help\" for help"
  reloaded: "&aConfig đã được nạp lại thành công!"
  help: "&bCommands\n- /bettermessages help: Trợ giúp\n- /bettermessages reload: Nạp lại cấu hình"
  changed-message: "&bChanged message {message}"

messages:
  # 1. Chữ to giữa màn hình (Title & Subtitle) khi vào game
  join-title:
    enabled: true
    priority: -1
    count:
      - -1
    permission: false
    message-type: title
    message:
      - "&c&l⚡ &6&lSERVER NGƯỜI GẦY &c&l⚡[SUBTITLE]&eChào que tăm &b&l{player} &eđã hạ cánh an toàn![FADEIN-10][STAY-60][FADEOUT-10]"
    audience: user
    activation:
      - join
    storage-type: default
    delay: 10

  # 2. Thanh chữ góc dưới (Action Bar - ngay trên thanh máu)
  join-actionbar:
    enabled: true
    priority: -1
    count:
      - -1
    permission: false
    message-type: actionbar
    message:
      - "&c⚠ Cảnh báo gió cấp 12 &f• &aGõ &b/danhhieu &ađể chọn danh hiệu cho ngực lép &c⚠"
    audience: user
    activation:
      - join
    storage-type: default
    delay: 20

  # 3. Thông báo chung trong khung chat cho toàn bộ server khi vào game
  join:
    enabled: true
    priority: -1
    count:
      - -1
    permission: false
    message-type: chat
    message:
      - "&a&l[+] &e{player} &6đã bị gió thổi bay vào server!"
      - "&a&l[+] &e{player} &6vừa lảo đảo bước vào vì gió giật cấp 12!"
      - "&a&l[+] &e{player} &6vừa bay qua nóc nhà đáp xuống làng Gầy!"
    audience: server
    activation:
      - join
    storage-type: default
    delay: 0

  # 4. Người chơi mới vào lần đầu tiên
  first-join:
    enabled: true
    priority: -1
    count:
      - 1
    permission: false
    message-type: chat
    message:
      - "&d&l★ &eChào mừng que tăm mới &b&l{player} &elần đầu tiên bị bão cuốn vào &c&lSERVER NGƯỜI GẦY&e! &d&l★"
    audience: server
    activation:
      - join
    delay: 0

  # 5. Thông báo khi rời server
  quit:
    enabled: true
    priority: -1
    count:
      - -1
    message-type: chat
    permission: false
    message:
      - "&c&l[-] &e{player} &7gầy quá không bám trụ nổi nên đã bay màu!"
      - "&c&l[-] &e{player} &7vừa bị một cơn gió nhẹ cuốn đi mất xác!"
      - "&c&l[-] &e{player} &7đã tan biến vì không chịu nổi sức ép không khí!"
    audience: server
    activation:
      - quit
    delay: 0
