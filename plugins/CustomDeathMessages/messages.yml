groups:
  default:
    default-messages:
      - "&c☠ &e{victim} &7gầy quá không chịu nổi nhiệt nên đã bay màu!"
      - "&c☠ &e{victim} &7kiệt sức vì thân hình que tăm chỉ còn da bọc xương!"
      - "&c☠ &e{victim} &7đã tan biến thành làn khói mỏng vì quá nhẹ cân!"
    cause-messages:
      FALL:
        - "&c☠ &e{victim} &7bước hụt chân xuống hố vì cặp giò khẳng khiu!"
        - "&c☠ &e{victim} &7tiếp đất bằng mông do gió thổi mất thăng bằng!"
        - "&c☠ &e{victim} &7quên mất là người gầy rơi từ trên cao xuống cũng vỡ xương!"
      ENTITY_ATTACK:
        - "&c☠ &e{victim} &7bị &c{killer_name} &7thổi nhẹ một cái là ngã gục!"
        - "&c☠ &e{victim} &7trơ xương không đỡ nổi một đòn từ &c{killer_name}&7!"
        - "&c☠ &c{killer_name} &7đã bẻ gãy bộ hài cốt còi cọc của &e{victim}&7!"
      PROJECTILE:
        - "&c☠ &e{victim} &7bị &c{killer_name} &7bắn xuyên qua hai khe xương sườn!"
        - "&c☠ &e{victim} &7đã khẳng khiu còn bị &c{killer_name} &7tia trúng tim!"
      DROWNING:
        - "&c☠ &e{victim} &7gầy trơ xương chìm nghỉm không ngoi lên nổi!"
        - "&c☠ &e{victim} &7không đủ mỡ để nổi trên mặt nước nên uống no nước rồi chìm!"
      STARVATION:
        - "&c☠ &e{victim} &7đã gầy như que tăm còn nhịn ăn nên quy tiên!"
        - "&c☠ &e{victim} &7quên ăn cơm 3 bữa một ngày, da bọc xương quy tiên!"
      LAVA:
        - "&c☠ &e{victim} &7bị nhúng vào dung nham, giòn tan như tóp mỡ!"
        - "&c☠ &e{victim} &7gầy quá nên tan chảy trong dung nham chỉ trong một nốt nhạc!"
      FIRE:
        - "&c☠ &e{victim} &7bốc hỏa cháy như que củi khô!"
      FIRE_TICK:
        - "&c☠ &e{victim} &7người toàn củi khô nên bén lửa thiêu rụi!"
      BLOCK_EXPLOSION:
        - "&c☠ &e{victim} &7bị nổ bay mất xác, xương sườn văng tứ tung!"
      ENTITY_EXPLOSION:
        - "&c☠ &e{victim} &7bị Creeper cho nổ tung, que tăm gãy làm đôi!"
      VOID:
        - "&c☠ &e{victim} &7bị gió thổi bay thẳng xuống Hư Vô không lối thoát!"
      SUFFOCATION:
        - "&c☠ &e{victim} &7ngực lép quá không hít thở nổi nên ngạt thở trong tường!"
      LIGHTNING:
        - "&c☠ &e{victim} &7bị sét đánh trúng cột thu lôi di động khẳng khiu!"
      MAGIC:
        - "&c☠ &e{victim} &7đã ốm yếu còn dính ma thuật độc hại nên tắt thở!"
      POISON:
        - "&c☠ &e{victim} &7đã xanh xao còn trúng độc xanh cỏ luôn!"
      WITHER:
        - "&c☠ &e{victim} &7bị Wither rút cạn chút sinh lực còi cọc cuối cùng!"
      CONTACT:
        - "&c☠ &e{victim} &7ôm xương rồng bị gai đâm thủng da bọc xương!"
      CRAMMING:
        - "&c☠ &e{victim} &7bị đám đông chèn ép bẹp dúm như tờ giấy A4!"
      DRAGON_BREATH:
        - "&c☠ &e{victim} &7bị Rồng Ender hắt hơi một cái là bốc hơi!"
      FLY_INTO_WALL:
        - "&c☠ &e{victim} &7bay lượn như cánh diều đứt dây tông thẳng vào vách núi!"
      HOT_FLOOR:
        - "&c☠ &e{victim} &7bước lên khối magma bị bỏng cặp chân khẳng khiu!"
      FREEZE:
        - "&c☠ &e{victim} &7không có tí mỡ nào chống rét nên đông cứng như que kem!"
      SONIC_BOOM:
        - "&c☠ &e{victim} &7bị sóng âm Warden thổi bay cả người lẫn xương cốt!"

